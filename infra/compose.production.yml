name: tianho-production

services:
  gateway:
    build:
      context: caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    depends_on:
      - web
      - api
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    environment:
      API_INTERNAL_URL: http://api:8080
      CONTENT_PROVIDER: api
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,uid=10001,gid=10001,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      SESSION_SCHEMA_INITIALIZATION: never
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      MEDIA_PUBLIC_BASE_URL: /media
      INQUIRY_IP_HASH_KEY: ${INQUIRY_IP_HASH_KEY:?INQUIRY_IP_HASH_KEY is required}
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      ORIGIN_VALIDATION_ENABLED: "true"
      ALLOWED_ORIGINS: https://${SITE_DOMAIN:?SITE_DOMAIN is required}
      INQUIRY_NOTIFICATIONS_ENABLED: ${INQUIRY_NOTIFICATIONS_ENABLED:-false}
      SES_REGION: ${SES_REGION:-ap-northeast-1}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      SES_TO_ADDRESS: ${SES_TO_ADDRESS:-}
      CONSOLE_LOG_STRUCTURED_FORMAT: logstash
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-unknown}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  database-backup:
    profiles:
      - operations
    build:
      context: backup
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${BACKUP_MEMORY_LIMIT:-768m}
    environment:
      BACKUP_DB_HOST: ${BACKUP_DB_HOST:?BACKUP_DB_HOST is required}
      BACKUP_DB_PORT: ${BACKUP_DB_PORT:-5432}
      BACKUP_DB_NAME: ${BACKUP_DB_NAME:-tianho}
      BACKUP_DB_SSL_MODE: ${BACKUP_DB_SSL_MODE:-require}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:?BACKUP_ENCRYPTION_PASSWORD is required}
      BACKUP_AUTHENTICATION_KEY: ${BACKUP_AUTHENTICATION_KEY:?BACKUP_AUTHENTICATION_KEY is required}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?BACKUP_BUCKET is required}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT:?BACKUP_ENDPOINT is required}
      BACKUP_ACCESS_KEY: ${BACKUP_ACCESS_KEY:?BACKUP_ACCESS_KEY is required}
      BACKUP_SECRET_KEY: ${BACKUP_SECRET_KEY:?BACKUP_SECRET_KEY is required}
      BACKUP_REGION: ${BACKUP_REGION:-auto}
      BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:?BACKUP_ALERT_WEBHOOK is required}
      RESTORE_DB_HOST: ${RESTORE_DB_HOST:?RESTORE_DB_HOST is required}
      RESTORE_DB_PORT: ${RESTORE_DB_PORT:-5432}
      RESTORE_DB_ADMIN_USERNAME: ${RESTORE_DB_ADMIN_USERNAME:?RESTORE_DB_ADMIN_USERNAME is required}
      RESTORE_DB_ADMIN_PASSWORD: ${RESTORE_DB_ADMIN_PASSWORD:?RESTORE_DB_ADMIN_PASSWORD is required}
      RESTORE_DB_SSL_MODE: ${RESTORE_DB_SSL_MODE:-require}
      TMPDIR: /work
    read_only: true
    volumes:
      - backup-work:/work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "test -f /work/last-backup-success && test $$(( $$(date +%s) - $$(stat -c %Y /work/last-backup-success) )) -lt 129600"]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 26h

volumes:
  caddy-data:
  caddy-config:
  backup-work:

networks:
  frontend:
  backup:
