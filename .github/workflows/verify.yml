name: Verify project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Verify web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: local-build-secret-with-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      CONTENT_PROVIDER: db
      ADMIN_SEED_EMAIL: admin@tianho.local
      ADMIN_SEED_PASSWORD: local-admin-change-me
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare local database
        run: |
          npm run prisma:generate
          npm exec --workspace=@tianho/web -- prisma migrate deploy
          npm run prisma:seed
      - name: Check source
        run: npm run lint
      - name: Build web application
        run: npm run build

  api:
    name: Verify API application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build and test API
        working-directory: apps/api
        run: ./gradlew build --no-daemon
