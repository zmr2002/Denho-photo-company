spring:
  application:
    name: tianho-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tianho}
    username: ${DATABASE_USERNAME:tianho}
    password: ${DATABASE_PASSWORD:tianho-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: ${SESSION_SCHEMA_INITIALIZATION:always}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: __Host-tianho-session
        http-only: true
        secure: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
