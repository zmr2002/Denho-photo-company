spring:
  application:
    name: tianho-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tianho}
    username: ${DATABASE_USERNAME:tianho}
    password: ${DATABASE_PASSWORD:tianho-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: ${SESSION_SCHEMA_INITIALIZATION:never}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: __Host-tianho-session
        http-only: true
        secure: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

tianho:
  auth:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Administrator}
    session:
      absolute-timeout: 8h
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY:}
      issuer: Tianho
      challenge-timeout: 5m
  content:
    bootstrap:
      enabled: ${CONTENT_BOOTSTRAP_ENABLED:false}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:auto}
    bucket: ${OBJECT_STORAGE_BUCKET:tianho-media}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:tianho-local}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:tianho-local-password}
  inquiry:
    ip-hash-key: ${INQUIRY_IP_HASH_KEY:tianho-local-inquiry-ip-key}
    retention-period: ${INQUIRY_RETENTION_PERIOD:180d}
    retention-cron: ${INQUIRY_RETENTION_CRON:0 35 3 * * *}
    turnstile:
      enabled: ${TURNSTILE_ENABLED:false}
      secret: ${TURNSTILE_SECRET_KEY:}
    notifications:
      enabled: ${INQUIRY_NOTIFICATIONS_ENABLED:false}
      region: ${SES_REGION:ap-northeast-1}
      from-address: ${SES_FROM_ADDRESS:}
      to-address: ${SES_TO_ADDRESS:}
      poll-delay: 5000
  security:
    origin-validation-enabled: ${ORIGIN_VALIDATION_ENABLED:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false
  max-request-body-size: none
